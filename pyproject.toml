[build-system]
requires = ["setuptools>=69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic_parser"
version = "0.1"
description = "A tool for processing python code repositories into semantic graphs."
license = { text = "MIT" }
keywords = ["dependency-graph", "code-analysis"]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.6",
    "code2flow (>=2.5.1,<3.0.0)",
    "graphviz (>=0.20.3,<0.21.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "pyparsing (>=3.2.1,<4.0.0)",
    "pydot (>=3.0.4,<4.0.0)",
]
requires-python = ">=3.10"

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9"
]

[tool.setuptools]
packages = ["reprocess"]

[tool.setuptools.package-data]
data = ["path.json"]
